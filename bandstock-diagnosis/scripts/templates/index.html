<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>波段诊股 - 技术分析工具</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
/* ========== Reset & Base ========== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh}
.app{max-width:1200px;margin:0 auto;padding:16px}

/* ========== Header ========== */
.header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);color:#fff;padding:20px 24px;border-radius:12px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header h1{font-size:22px;font-weight:700;letter-spacing:1px}
.header h1 span{color:#e94560;font-size:14px;font-weight:400;margin-left:8px;opacity:.85}
.params-bar{display:flex;gap:10px;flex-wrap:wrap}
.param-tag{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#ccc;font-size:11px;padding:3px 8px;border-radius:4px;font-family:monospace}

/* ========== Search ========== */
.search-wrap{position:relative;margin-bottom:16px}
.search-box{display:flex;background:#fff;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.08);overflow:hidden}
.search-box input{flex:1;border:none;padding:14px 18px;font-size:16px;outline:none;color:#1a1a2e}
.search-box input::placeholder{color:#999}
.search-box button{background:#e94560;color:#fff;border:none;padding:14px 28px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s;white-space:nowrap}
.search-box button:hover{background:#d63850}
.search-box button:disabled{background:#bbb;cursor:not-allowed}

.autocomplete{position:absolute;top:100%;left:0;right:0;background:#fff;border-radius:0 0 10px 10px;box-shadow:0 6px 20px rgba(0,0,0,.12);z-index:1000;max-height:360px;overflow-y:auto;display:none}
.autocomplete.active{display:block}
.ac-item{padding:10px 18px;cursor:pointer;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0f0f0;transition:.15s}
.ac-item:hover{background:#fff0f3}
.ac-item .code{font-weight:700;font-family:monospace;font-size:14px;min-width:70px}
.ac-item .name{font-size:14px;color:#333;flex:1}
.ac-item .tag{font-size:10px;padding:2px 6px;border-radius:3px;font-weight:500}
.tag-etf{background:#e8f5e9;color:#2e7d32}
.tag-stock{background:#e3f2fd;color:#1565c0}
.ac-item .market{font-size:11px;color:#999}

/* ========== Progress Panel ========== */
.progress-panel{
  display:none;
  background:#1e1e2e;
  border-radius:10px;
  margin-bottom:16px;
  overflow:hidden;
  box-shadow:0 2px 12px rgba(0,0,0,.12);
  transition: all .3s;
}
.progress-panel.active{display:block}
.progress-panel.collapsed .progress-body{display:none}
.progress-panel.collapsed .progress-chevron{transform:rotate(-90deg)}

.progress-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 16px;
  cursor:pointer;
  user-select:none;
  background:rgba(255,255,255,.02);
  border-bottom:1px solid rgba(255,255,255,.06);
  transition:background .15s;
}
.progress-header:hover{background:rgba(255,255,255,.04)}
.progress-header-left{display:flex;align-items:center;gap:10px}
.progress-spinner{
  width:16px;height:16px;
  border:2px solid rgba(255,255,255,.15);
  border-top-color:rgba(255,255,255,.6);
  border-radius:50%;
  animation:spin .8s linear infinite;
  flex-shrink:0;
}
.progress-spinner.done{
  animation:none;
  border-color:rgba(81,207,102,.3);
  border-top-color:transparent;
}
.progress-spinner.error{
  animation:none;
  border-color:rgba(255,107,107,.3);
  border-top-color:transparent;
}
.progress-status{
  font-size:13px;
  color:rgba(255,255,255,.7);
}
.progress-status.done{color:#51cf66}
.progress-status.error{color:#ff6b6b}
.progress-status-icon{font-size:14px;margin-right:2px}

.progress-meta{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:11px;
  color:rgba(255,255,255,.4);
}
.progress-chevron{
  font-size:11px;
  color:rgba(255,255,255,.35);
  transition:transform .2s;
  flex-shrink:0;
}

.progress-body{
  max-height:320px;
  overflow-y:auto;
  padding:8px 0;
  transition:max-height .3s;
}
.progress-body::-webkit-scrollbar{width:4px}
.progress-body::-webkit-scrollbar-track{background:transparent}
.progress-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}

.progress-log{padding:0 16px}
.progress-log .log-entry{
  display:flex;
  gap:10px;
  padding:3px 0;
  font-family:'Consolas','Monaco','Courier New','Microsoft YaHei',monospace;
  font-size:12px;
  line-height:1.7;
  animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

.log-time{
  color:rgba(255,255,255,.18);
  flex-shrink:0;
  min-width:48px;
  text-align:right;
}
.log-dot{
  color:rgba(255,255,255,.2);
  flex-shrink:0;
}
.log-msg{
  color:rgba(255,255,255,.45);
  word-break:break-all;
}
.log-msg.phase-fetch{color:rgba(125,180,255,.6)}
.log-msg.phase-calc{color:rgba(180,160,255,.55)}
.log-msg.phase-score{color:rgba(255,200,130,.6)}
.log-msg.phase-done{color:rgba(130,220,160,.65)}
.log-msg.level-warn{color:rgba(255,200,100,.55)}
.log-msg.level-error{color:rgba(255,120,120,.75)}

/* Error banner inside progress */
.progress-error{
  margin:0 16px 10px;
  padding:10px 14px;
  background:rgba(255,80,80,.08);
  border:1px solid rgba(255,80,80,.2);
  border-radius:6px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.progress-error .err-icon{font-size:14px}
.progress-error .err-msg{font-size:12px;color:#ff8a8a;line-height:1.6}
.progress-error .err-action{font-size:11px;color:rgba(255,180,140,.7);line-height:1.5}
.progress-error .err-btns{display:flex;gap:8px;margin-top:4px}
.progress-error button{
  padding:5px 14px;
  border-radius:5px;
  border:none;
  font-size:12px;
  cursor:pointer;
  font-weight:500;
  transition:.15s;
}
.progress-error .btn-retry{background:rgba(255,255,255,.15);color:#fff}
.progress-error .btn-retry:hover{background:rgba(255,255,255,.25)}
.progress-error .btn-back{background:transparent;color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.15)}
.progress-error .btn-back:hover{background:rgba(255,255,255,.06)}

/* Result */
.result{display:none}
.result.active{display:block}

/* Price Header */
.price-header{background:#fff;border-radius:10px;padding:20px 24px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.06);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px}
.price-info h2{font-size:16px;color:#666;font-weight:400}
.price-info .name-line{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.price-info .code-display{font-family:monospace;font-size:13px;color:#999;background:#f5f5f5;padding:2px 8px;border-radius:4px}
.price-info .price-big{font-size:40px;font-weight:800;line-height:1.2}
.price-info .change-line{font-size:16px;font-weight:600}
.price-info .change-line.up{color:#e84040}
.price-info .change-line.down{color:#21a366}
.price-meta{display:flex;gap:24px;flex-wrap:wrap}
.meta-item{text-align:center}
.meta-item .meta-val{font-size:18px;font-weight:700}
.meta-item .meta-label{font-size:11px;color:#999;margin-top:2px}

/* Score Card */
.score-card{background:#fff;border-radius:10px;padding:20px 24px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.score-card h3{font-size:15px;color:#666;margin-bottom:12px}
.score-main{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.score-badge{width:80px;height:80px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#fff;flex-shrink:0}
.score-conclusion{font-size:18px;font-weight:700}
.score-suggestion{font-size:13px;color:#666;margin-top:4px}
.reasons{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.reason{font-size:12px;padding:4px 10px;border-radius:12px;font-weight:500}
.reason-bull{background:#fff0f0;color:#c62828}
.reason-bear{background:#e8f5e9;color:#1b5e20}
.reason-neutral{background:#f5f5f5;color:#666}

/* Charts */
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
@media(max-width:768px){.charts-grid{grid-template-columns:1fr}}
.chart-card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.chart-card h4{font-size:13px;color:#666;font-weight:600;margin-bottom:10px}
.chart-card canvas{width:100%!important;height:260px!important}
.chart-full{background:#fff;border-radius:10px;padding:16px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.chart-full h4{font-size:13px;color:#666;font-weight:600;margin-bottom:10px}
.chart-full canvas{width:100%!important;height:320px!important}

/* Indicators */
.indicators-panel{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:12px}
.ind-card{background:#fff;border-radius:8px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.ind-card .ind-label{font-size:11px;color:#999;margin-bottom:4px}
.ind-card .ind-value{font-size:18px;font-weight:700;font-family:monospace}
.ind-card .ind-sub{font-size:11px;color:#999;margin-top:2px;font-family:monospace}

/* Support / Resistance */
.sr-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.sr-card{background:#fff;border-radius:10px;padding:18px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.sr-card h4{font-size:14px;font-weight:700;margin-bottom:10px;padding-bottom:8px;border-bottom:2px solid}
.sr-card.resistance h4{color:#e84040;border-color:#e84040}
.sr-card.support h4{color:#21a366;border-color:#21a366}
.sr-card .current-price{font-size:13px;color:#999;margin-bottom:10px}
.sr-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f5f5f5;font-size:13px}
.sr-row .sr-label{color:#666}
.sr-row .sr-price{font-weight:700;font-family:monospace}
.sr-card.resistance .sr-price{color:#e84040}
.sr-card.support .sr-price{color:#21a366}

/* Footer */
.footer{text-align:center;padding:20px;color:#999;font-size:12px}

/* Empty state */
.empty-state{text-align:center;padding:80px 20px;color:#ccc}
.empty-state svg{width:80px;height:80px;margin-bottom:16px;opacity:.4}
.empty-state p{font-size:16px}

@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <div class="header">
    <h1>📈 波段诊股 <span>技术分析工具</span></h1>
    <div class="params-bar" id="paramsBar">
      <span class="param-tag">MA: 10/20/50/120</span>
      <span class="param-tag">MACD: 19,39,9</span>
      <span class="param-tag">RSI: 14/21/42</span>
      <span class="param-tag">BOLL: 30,2</span>
      <span class="param-tag">KDJ: 34,5,10</span>
    </div>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="输入股票/ETF代码或名称，如 159851、贵州茅台、600519..."
             autocomplete="off">
      <button id="searchBtn" onclick="doAnalyze()">🔍 分析诊断</button>
    </div>
    <div class="autocomplete" id="autocomplete"></div>
  </div>

  <!-- ========== Progress Panel ========== -->
  <div class="progress-panel" id="progressPanel">
    <div class="progress-header" id="progressHeader" onclick="toggleProgress()">
      <div class="progress-header-left">
        <div class="progress-spinner" id="progressSpinner"></div>
        <span class="progress-status" id="progressStatus">准备中...</span>
      </div>
      <div class="progress-meta">
        <span id="progressTimer">0.0s</span>
        <span class="progress-chevron" id="progressChevron">▾</span>
      </div>
    </div>
    <div class="progress-body" id="progressBody">
      <div class="progress-log" id="progressLog"></div>
    </div>
  </div>

  <!-- Empty State -->
  <div class="empty-state" id="emptyState">
    <svg viewBox="0 0 80 80"><rect x="10" y="20" width="60" height="45" rx="3" fill="#ddd"/><line x1="20" y1="35" x2="60" y2="35" stroke="#fff" stroke-width="3"/><line x1="20" y1="45" x2="50" y2="45" stroke="#fff" stroke-width="3"/><line x1="20" y1="55" x2="55" y2="55" stroke="#fff" stroke-width="3"/><circle cx="40" cy="12" r="5" fill="#ddd"/></svg>
    <p>输入股票/ETF代码，获取波段技术分析</p>
  </div>

  <!-- Results -->
  <div class="result" id="result">
    <div class="price-header" id="priceHeader"></div>
    <div class="score-card" id="scoreCard"></div>
    <div class="indicators-panel" id="indicatorsPanel"></div>
    <div class="chart-full">
      <h4>📊 K线走势 & 均线系统</h4>
      <canvas id="chartKline"></canvas>
    </div>
    <div class="charts-grid">
      <div class="chart-card">
        <h4>📉 MACD (19,39,9)</h4>
        <canvas id="chartMACD"></canvas>
      </div>
      <div class="chart-card">
        <h4>📊 RSI (14/21/42)</h4>
        <canvas id="chartRSI"></canvas>
      </div>
      <div class="chart-card">
        <h4>📈 KDJ (34,5,10)</h4>
        <canvas id="chartKDJ"></canvas>
      </div>
      <div class="chart-card">
        <h4>📊 成交量</h4>
        <canvas id="chartVolume"></canvas>
      </div>
    </div>
    <div class="sr-grid">
      <div class="sr-card resistance">
        <h4>🔴 阻力位</h4>
        <div class="current-price">当前价: <strong id="srPriceR"></strong></div>
        <div id="resistancesList"></div>
      </div>
      <div class="sr-card support">
        <h4>🟢 支撑位</h4>
        <div class="current-price">当前价: <strong id="srPriceS"></strong></div>
        <div id="supportsList"></div>
      </div>
    </div>
  </div>

  <div class="footer">波段诊股 v1.1 · 技术指标仅供参考，不构成投资建议 · A股市场有风险，投资需谨慎</div>
</div>

<script>
// ========== Chart.js Defaults ==========
Chart.defaults.font.family = '-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif';
Chart.defaults.font.size = 10;
Chart.defaults.plugins.legend.labels.usePointStyle = true;
Chart.defaults.plugins.legend.labels.pointStyleWidth = 8;
Chart.defaults.interaction.mode = 'index';
Chart.defaults.interaction.intersect = false;

// ========== Global State ==========
let currentData = null;
let currentCode = null;
let charts = {};
let searchTimeout = null;
let sseSource = null;
let progressTimer = null;
let progressStartTime = 0;
let progressFinished = false;

// ========== Auto-complete ==========
const searchInput = document.getElementById('searchInput');
const autocomplete = document.getElementById('autocomplete');

searchInput.addEventListener('input', function() {
  const q = this.value.trim();
  if (q.length < 1) { autocomplete.classList.remove('active'); return; }
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    fetch(`/api/search?q=${encodeURIComponent(q)}`)
      .then(r => r.json())
      .then(data => renderAutocomplete(data.results || []))
      .catch(() => {});
  }, 200);
});

searchInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { e.preventDefault(); doAnalyze(); autocomplete.classList.remove('active'); }
  if (e.key === 'Escape') { autocomplete.classList.remove('active'); }
});

document.addEventListener('click', function(e) {
  if (!e.target.closest('.search-wrap')) autocomplete.classList.remove('active');
});

function renderAutocomplete(results) {
  if (!results.length) { autocomplete.classList.remove('active'); return; }
  autocomplete.innerHTML = results.map(s => {
    const tagClass = s.type === 'ETF' ? 'tag-etf' : 'tag-stock';
    return `<div class="ac-item" onclick="selectStock('${s.code}','${s.name}')">
      <span class="tag ${tagClass}">${s.type}</span>
      <span class="code">${s.code}</span>
      <span class="name">${s.name}</span>
      <span class="market">${s.market}</span></div>`;
  }).join('');
  autocomplete.classList.add('active');
}

function selectStock(code, name) {
  searchInput.value = `${code} ${name}`;
  autocomplete.classList.remove('active');
  doAnalyze();
}

// ========== Progress Panel ==========
function initProgress() {
  progressFinished = false;
  const panel = document.getElementById('progressPanel');
  panel.classList.remove('collapsed');
  panel.classList.add('active');
  
  // Reset header
  const spinner = document.getElementById('progressSpinner');
  spinner.className = 'progress-spinner';
  
  const status = document.getElementById('progressStatus');
  status.textContent = '准备中...';
  status.className = 'progress-status';
  
  // Reset log
  document.getElementById('progressLog').innerHTML = '';
  document.getElementById('progressTimer').textContent = '0.0s';
  
  // Remove any error banner
  const oldErr = document.getElementById('progressErrorBanner');
  if (oldErr) oldErr.remove();
  
  progressStartTime = Date.now();
  
  // Start timer
  if (progressTimer) clearInterval(progressTimer);
  progressTimer = setInterval(() => {
    if (progressFinished) { clearInterval(progressTimer); return; }
    const elapsed = ((Date.now() - progressStartTime) / 1000).toFixed(1);
    document.getElementById('progressTimer').textContent = elapsed + 's';
  }, 200);
  
  // Scroll to bottom helper
  window._progressScrollToBottom = function() {
    const body = document.getElementById('progressBody');
    body.scrollTop = body.scrollHeight;
  };
}

function addProgressLog(msg, phaseClass) {
  const log = document.getElementById('progressLog');
  const now = new Date();
  const time = now.toTimeString().slice(0,8);
  const cls = phaseClass ? `log-msg phase-${phaseClass}` : 'log-msg';
  
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.innerHTML = `<span class="log-time">${time}</span><span class="log-dot">│</span><span class="${cls}">${msg}</span>`;
  log.appendChild(entry);
  
  window._progressScrollToBottom();
}

function addProgressError(msg, action) {
  progressFinished = true;
  if (progressTimer) clearInterval(progressTimer);
  
  // Update spinner and status
  const spinner = document.getElementById('progressSpinner');
  spinner.className = 'progress-spinner error';
  
  const status = document.getElementById('progressStatus');
  status.innerHTML = '<span class="progress-status-icon">✖</span> 分析出错';
  status.className = 'progress-status error';
  
  // Add error entry to log
  addProgressLog('✖ ' + msg, 'level-error');
  
  // Show error banner
  showErrorBanner(msg, action);
  
  // Keep panel expanded
  const panel = document.getElementById('progressPanel');
  panel.classList.remove('collapsed');
  panel.classList.add('active');
  
  document.getElementById('searchBtn').disabled = false;
}

function showErrorBanner(msg, action) {
  const body = document.getElementById('progressBody');
  // Remove old banner
  const oldBanner = document.getElementById('progressErrorBanner');
  if (oldBanner) oldBanner.remove();
  
  const banner = document.createElement('div');
  banner.id = 'progressErrorBanner';
  banner.className = 'progress-error';
  banner.innerHTML = `
    <div class="err-icon">⚠️ 分析过程出错</div>
    <div class="err-msg">${msg}</div>
    <div class="err-action">💡 ${action}</div>
    <div class="err-btns">
      <button class="btn-retry" onclick="doAnalyze()">🔄 重试</button>
      <button class="btn-back" onclick="focusSearch()">✏ 修改代码</button>
    </div>`;
  body.appendChild(banner);
  window._progressScrollToBottom();
}

function finishProgress(success) {
  progressFinished = true;
  if (progressTimer) clearInterval(progressTimer);
  
  const spinner = document.getElementById('progressSpinner');
  const status = document.getElementById('progressStatus');
  const elapsed = ((Date.now() - progressStartTime) / 1000).toFixed(1);
  document.getElementById('progressTimer').textContent = elapsed + 's';
  
  if (success) {
    spinner.className = 'progress-spinner done';
    status.innerHTML = '<span class="progress-status-icon">✓</span> 分析完成';
    status.className = 'progress-status done';
    
    // Auto-collapse after 2 seconds
    setTimeout(() => {
      const panel = document.getElementById('progressPanel');
      if (panel && !panel.matches(':hover')) {
        panel.classList.add('collapsed');
      }
    }, 2500);
  }
  
  document.getElementById('searchBtn').disabled = false;
}

function toggleProgress() {
  const panel = document.getElementById('progressPanel');
  panel.classList.toggle('collapsed');
}

function focusSearch() {
  searchInput.focus();
  searchInput.select();
}

// ========== Analysis (SSE Streaming) ==========
function doAnalyze() {
  const q = searchInput.value.trim();
  if (!q) return;
  
  let code = q.split(/\s+/)[0];
  code = code.replace(/[^a-zA-Z0-9.]/g, '');
  if (!code) return;
  
  // Close any existing SSE connection
  if (sseSource) { sseSource.close(); sseSource = null; }
  
  destroyCharts();
  hideResult();
  initProgress();
  
  document.getElementById('searchBtn').disabled = true;
  document.getElementById('emptyState').style.display = 'none';
  
  addProgressLog('开始连接分析服务...', 'fetch');
  
  const url = `/api/analyze/stream?code=${encodeURIComponent(code)}`;
  sseSource = new EventSource(url);
  
  // ── progress events ──
  sseSource.addEventListener('progress', function(e) {
    try {
      const data = JSON.parse(e.data);
      const phase = data.phase || 'fetch';
      const cls = data.level === 'warn' ? 'level-warn' : `phase-${phase}`;
      addProgressLog(data.msg, cls);
      
      // Update status text
      const status = document.getElementById('progressStatus');
      if (data.step === 'all_done') {
        status.textContent = '正在渲染...';
      } else if (data.phase === 'fetch') {
        status.textContent = '正在获取数据...';
      } else if (data.phase === 'calc') {
        status.textContent = '正在计算指标...';
      } else if (data.phase === 'score') {
        status.textContent = '正在生成评分...';
      }
    } catch(err) {}
  });
  
  // ── error events ──
  sseSource.addEventListener('error', function(e) {
    try {
      const data = JSON.parse(e.data);
      addProgressError(data.msg || '未知错误', data.action || '请检查代码或网络后重试');
    } catch(err) {
      addProgressError('分析服务连接异常', '请确认后端服务是否正常运行，然后重试');
    }
    sseSource.close();
    sseSource = null;
  });
  
  // ── result event ──
  sseSource.addEventListener('result', function(e) {
    try {
      const data = JSON.parse(e.data);
      sseSource.close();
      sseSource = null;
      
      finishProgress(true);
      
      currentData = data;
      currentCode = code;
      showResult();
      renderAll(data);
      
    } catch(err) {
      addProgressError('结果数据解析失败: ' + err.message, '请重试，如持续失败请联系技术支持');
      sseSource.close();
      sseSource = null;
    }
  });
  
  // ── connection error (EventSource onerror) ──
  sseSource.onerror = function(e) {
    // Only handle if we haven't already received a result or explicit error
    if (!progressFinished) {
      addProgressError(
        '无法连接到分析服务',
        '请检查：<br>1. 后端服务是否启动（python app.py）<br>2. 端口 5000 是否被占用<br>3. 防火墙/代理是否阻止了连接'
      );
    }
    sseSource.close();
    sseSource = null;
  };
}

// ========== Rendering ==========
function renderAll(d) {
  renderPriceHeader(d);
  renderScore(d.scoring);
  renderIndicators(d.snapshot);
  renderSR(d.support_resistance);
  renderCharts(d.chart);
}

function renderPriceHeader(d) {
  const rt = d.realtime || {};
  const price = rt.price || d.support_resistance?.price || 0;
  const prevClose = rt.prev_close || 0;
  const change = rt.change || (price - prevClose);
  const changePct = rt.change_pct || (prevClose ? ((price - prevClose) / prevClose * 100) : 0);
  const isUp = change >= 0;
  const name = d.name || rt.name || d.code;
  const codeDisplay = d.code.split('.').pop();

  document.getElementById('priceHeader').innerHTML = `
    <div class="price-info">
      <div class="name-line">
        <span style="font-size:22px;font-weight:700">${name}</span>
        <span class="code-display">${codeDisplay}</span>
      </div>
      <div class="price-big">${price.toFixed(3)}</div>
      <div class="change-line ${isUp ? 'up' : 'down'}">
        ${isUp ? '+' : ''}${change.toFixed(3)} (${isUp ? '+' : ''}${changePct.toFixed(2)}%)
      </div>
    </div>
    <div class="price-meta">
      <div class="meta-item"><div class="meta-val">${rt.open ? rt.open.toFixed(3) : '-'}</div><div class="meta-label">开盘</div></div>
      <div class="meta-item"><div class="meta-val">${rt.high ? rt.high.toFixed(3) : '-'}</div><div class="meta-label">最高</div></div>
      <div class="meta-item"><div class="meta-val">${rt.low ? rt.low.toFixed(3) : '-'}</div><div class="meta-label">最低</div></div>
      <div class="meta-item"><div class="meta-val">${rt.amount ? (rt.amount/1e8).toFixed(2)+'亿' : '-'}</div><div class="meta-label">成交额</div></div>
      <div class="meta-item"><div class="meta-val">${rt.turnover ? rt.turnover.toFixed(2)+'%' : '-'}</div><div class="meta-label">换手率</div></div>
    </div>`;
}

function renderScore(s) {
  const bgColor = s.color || '#f5a623';
  document.getElementById('scoreCard').innerHTML = `
    <h3>📋 综合评估</h3>
    <div class="score-main">
      <div class="score-badge" style="background:${bgColor}">${s.score > 0 ? '+' : ''}${s.score}</div>
      <div>
        <div class="score-conclusion" style="color:${bgColor}">${s.conclusion}</div>
        <div class="score-suggestion">💡 ${s.suggestion}</div>
      </div>
    </div>
    <div class="reasons">
      ${(s.reasons||[]).map(r => {
        let cls = 'reason-neutral';
        if (r[0].includes('多')) cls = 'reason-bull';
        else if (r[0].includes('空')) cls = 'reason-bear';
        return `<span class="reason ${cls}">${r[1]}</span>`;
      }).join('')}
    </div>`;
}

function renderIndicators(snap) {
  if (!snap) return;
  const items = [
    {label:'MA10', value:snap.MA10, fmt:3},
    {label:'MA20', value:snap.MA20, fmt:3},
    {label:'MA50', value:snap.MA50, fmt:3},
    {label:'MA120', value:snap.MA120, fmt:3},
    {label:'MACD DIF', value:snap.DIF, fmt:4},
    {label:'MACD DEA', value:snap.DEA, fmt:4},
    {label:'MACD HIST', value:snap.HIST, fmt:4},
    {label:'RSI14', value:snap.RSI14, fmt:1},
    {label:'RSI21', value:snap.RSI21, fmt:1},
    {label:'RSI42', value:snap.RSI42, fmt:1},
    {label:'布林上轨', value:snap.BOLL_UP, fmt:3},
    {label:'布林中轨', value:snap.BOLL_MID, fmt:3},
    {label:'布林下轨', value:snap.BOLL_LOW, fmt:3},
    {label:'KDJ K', value:snap.KDJ_K, fmt:1},
    {label:'KDJ D', value:snap.KDJ_D, fmt:1},
    {label:'KDJ J', value:snap.KDJ_J, fmt:1},
  ];
  document.getElementById('indicatorsPanel').innerHTML = items.map(it => {
    let color = '#333';
    if (it.label === 'MACD HIST') {
      color = it.value > 0 ? '#e84040' : '#21a366';
    } else if (it.label.startsWith('RSI')) {
      color = it.value >= 65 ? '#e84040' : it.value <= 30 ? '#21a366' : '#333';
    } else if (it.label.startsWith('KDJ')) {
      color = it.value >= 80 ? '#e84040' : it.value <= 20 ? '#21a366' : '#333';
    }
    const v = it.value != null ? it.value.toFixed(it.fmt) : '-';
    return `<div class="ind-card"><div class="ind-label">${it.label}</div><div class="ind-value" style="color:${color}">${v}</div></div>`;
  }).join('');
}

function renderSR(sr) {
  if (!sr) return;
  document.getElementById('srPriceR').textContent = sr.price?.toFixed(3) || '-';
  document.getElementById('srPriceS').textContent = sr.price?.toFixed(3) || '-';
  if (sr.resistances?.length) {
    document.getElementById('resistancesList').innerHTML = sr.resistances.map(r =>
      `<div class="sr-row"><span class="sr-label">${r.label}</span><span class="sr-price">${r.price.toFixed(3)}</span></div>`
    ).join('');
  } else {
    document.getElementById('resistancesList').innerHTML = '<div style="color:#999;font-size:12px;padding:8px 0">暂无阻力位</div>';
  }
  if (sr.supports?.length) {
    document.getElementById('supportsList').innerHTML = sr.supports.map(s =>
      `<div class="sr-row"><span class="sr-label">${s.label}</span><span class="sr-price">${s.price.toFixed(3)}</span></div>`
    ).join('');
  } else {
    document.getElementById('supportsList').innerHTML = '<div style="color:#999;font-size:12px;padding:8px 0">暂无支撑位</div>';
  }
}

// ========== Charts ==========
function destroyCharts() {
  Object.values(charts).forEach(c => c.destroy());
  charts = {};
}

function renderCharts(cd) {
  destroyCharts();
  if (!cd || !cd.dates?.length) return;

  const dates = cd.dates;
  const closes = cd.closes || [];

  // 1. K-line + MAs + Bollinger
  const ctx1 = document.getElementById('chartKline').getContext('2d');
  charts.kline = new Chart(ctx1, {
    type: 'line',
    data: {
      labels: dates,
      datasets: [
        {label:'收盘价',data:closes,borderColor:'#333',backgroundColor:'transparent',borderWidth:1.5,pointRadius:0,tension:0,order:10},
        {label:'MA10',data:cd.MA10,borderColor:'#f5a623',borderWidth:1,pointRadius:0,tension:0,order:5},
        {label:'MA20',data:cd.MA20,borderColor:'#e84040',borderWidth:1,pointRadius:0,tension:0,order:5},
        {label:'MA50',data:cd.MA50,borderColor:'#2196f3',borderWidth:1.5,pointRadius:0,tension:0,order:5},
        {label:'MA120',data:cd.MA120,borderColor:'#9c27b0',borderWidth:1.5,pointRadius:0,tension:0,borderDash:[6,3],order:5},
        {label:'布林上轨',data:cd.BOLL_UP,borderColor:'rgba(233,69,96,0.3)',backgroundColor:'transparent',borderWidth:0.8,pointRadius:0,borderDash:[3,3],order:0},
        {label:'布林中轨',data:cd.BOLL_MID,borderColor:'rgba(150,150,150,0.5)',backgroundColor:'transparent',borderWidth:0.8,pointRadius:0,borderDash:[3,3],order:0},
        {label:'布林下轨',data:cd.BOLL_LOW,borderColor:'rgba(33,163,102,0.3)',backgroundColor:'transparent',borderWidth:0.8,pointRadius:0,borderDash:[3,3],order:0},
      ]
    },
    options: {
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'top',labels:{boxWidth:16,padding:8,font:{size:10}}},tooltip:{mode:'index',intersect:false}},
      scales:{x:{ticks:{maxTicksLimit:15,font:{size:9}},grid:{display:false}},y:{ticks:{font:{size:9}},grid:{color:'#f0f0f0'}}}
    }
  });

  // 2. MACD
  const ctx2 = document.getElementById('chartMACD').getContext('2d');
  const histColors = (cd.HIST||[]).map(v => v >= 0 ? 'rgba(233,69,96,0.6)' : 'rgba(33,163,102,0.6)');
  charts.macd = new Chart(ctx2, {
    type:'bar',
    data:{
      labels:dates,
      datasets:[
        {label:'HIST',data:cd.HIST,backgroundColor:histColors,borderWidth:0,order:0},
        {label:'DIF',data:cd.DIF,borderColor:'#e84040',borderWidth:1,pointRadius:0,type:'line',order:1},
        {label:'DEA',data:cd.DEA,borderColor:'#2196f3',borderWidth:1,pointRadius:0,type:'line',order:1},
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'top',labels:{boxWidth:10,font:{size:9}}}},
      scales:{x:{ticks:{maxTicksLimit:12,font:{size:8}},grid:{display:false}},y:{ticks:{font:{size:8}},grid:{color:'#f0f0f0'}}}
    }
  });

  // 3. RSI
  const ctx3 = document.getElementById('chartRSI').getContext('2d');
  charts.rsi = new Chart(ctx3, {
    type:'line',
    data:{
      labels:dates,
      datasets:[
        {label:'RSI14',data:cd.RSI14,borderColor:'#e84040',borderWidth:1.5,pointRadius:0,tension:0.2},
        {label:'RSI42',data:cd.RSI42,borderColor:'#9c27b0',borderWidth:1.5,pointRadius:0,tension:0.2},
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'top',labels:{boxWidth:10,font:{size:9}}}},
      scales:{x:{ticks:{maxTicksLimit:12,font:{size:8}},grid:{display:false}},y:{min:0,max:100,ticks:{stepSize:20,font:{size:8}},grid:{color:'#f0f0f0'}}}
    },
    plugins:[{
      id:'rsiZones',
      beforeDraw(chart){
        const {ctx,chartArea:{top,bottom,left,right}}=chart;
        const yScale=chart.scales.y;if(!yScale)return;
        const y70=yScale.getPixelForValue(70),y30=yScale.getPixelForValue(30);
        ctx.save();
        ctx.fillStyle='rgba(233,69,96,0.04)';ctx.fillRect(left,y70,right-left,top-y70);
        ctx.fillStyle='rgba(33,163,102,0.04)';ctx.fillRect(left,bottom,right-left,y30-bottom);
        ctx.setLineDash([3,3]);
        ctx.strokeStyle='rgba(233,69,96,0.3)';ctx.beginPath();ctx.moveTo(left,y70);ctx.lineTo(right,y70);ctx.stroke();
        ctx.strokeStyle='rgba(33,163,102,0.3)';ctx.beginPath();ctx.moveTo(left,y30);ctx.lineTo(right,y30);ctx.stroke();
        ctx.restore();
      }
    }]
  });

  // 4. KDJ
  const ctx4 = document.getElementById('chartKDJ').getContext('2d');
  charts.kdj = new Chart(ctx4, {
    type:'line',
    data:{
      labels:dates,
      datasets:[
        {label:'K',data:cd.KDJ_K,borderColor:'#e84040',borderWidth:1.5,pointRadius:0,tension:0.2},
        {label:'D',data:cd.KDJ_D,borderColor:'#2196f3',borderWidth:1.5,pointRadius:0,tension:0.2},
        {label:'J',data:cd.KDJ_J,borderColor:'#9c27b0',borderWidth:1,pointRadius:0,tension:0.2,borderDash:[4,2]},
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{position:'top',labels:{boxWidth:10,font:{size:9}}}},
      scales:{x:{ticks:{maxTicksLimit:12,font:{size:8}},grid:{display:false}},y:{min:0,max:100,ticks:{stepSize:20,font:{size:8}},grid:{color:'#f0f0f0'}}}
    },
    plugins:[{
      id:'kdjZones',
      beforeDraw(chart){
        const {ctx,chartArea:{top,bottom,left,right}}=chart;
        const yScale=chart.scales.y;if(!yScale)return;
        const y80=yScale.getPixelForValue(80),y20=yScale.getPixelForValue(20);
        ctx.save();
        ctx.fillStyle='rgba(233,69,96,0.04)';ctx.fillRect(left,y80,right-left,top-y80);
        ctx.fillStyle='rgba(33,163,102,0.04)';ctx.fillRect(left,bottom,right-left,y20-bottom);
        ctx.restore();
      }
    }]
  });

  // 5. Volume
  const ctx5 = document.getElementById('chartVolume').getContext('2d');
  const volColors = [];
  for (let i = 1; i < (cd.volumes||[]).length; i++) {
    volColors.push((cd.closes[i]||0) >= (cd.closes[i-1]||0) ? 'rgba(233,69,96,0.5)' : 'rgba(33,163,102,0.5)');
  }
  volColors.push(volColors[volColors.length-1] || 'rgba(150,150,150,0.5)');
  charts.volume = new Chart(ctx5, {
    type:'bar',
    data:{labels:dates,datasets:[{label:'成交量',data:cd.volumes,backgroundColor:volColors,borderWidth:0}]},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{x:{ticks:{maxTicksLimit:12,font:{size:8}},grid:{display:false}},y:{ticks:{font:{size:8},callback:v=>v>=1e8?(v/1e8).toFixed(1)+'亿':(v/1e4).toFixed(0)+'万'},grid:{color:'#f0f0f0'}}}
    }
  });
}

// ========== UI Helpers ==========
function showResult() {
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('result').classList.add('active');
}
function hideResult() {
  document.getElementById('result').classList.remove('active');
}

// ========== URL param auto-load ==========
window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const code = params.get('code');
  if (code) {
    searchInput.value = code;
    doAnalyze();
  }
});
</script>
